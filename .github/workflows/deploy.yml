name: Deploy to Azure

# Continuous deployment to Azure Container Apps.
#
# Triggers:
#   - push to main (automatic)
#   - manual workflow_dispatch (override imageTag if you need to roll back)
#
# Preconditions (one-time setup):
#   1. Create an Entra ID app registration, give its service principal
#      Contributor on the RG and AcrPush on the ACR.
#   2. Add a federated credential on the app registration scoped to
#      repo:ShinoNice/agentic-chatbot:ref:refs/heads/main
#   3. Add repo secrets:
#        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#      Add repo vars:
#        AZURE_RG=rg-agentic-chatbot, ACR_NAME=acrhybridchatbot

on:
  # Manual-only until Azure OIDC is wired up.
  #
  # This workflow needs the following to actually succeed:
  #   - Entra app registration with a federated credential for this repo
  #   - Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
  #   - Repo vars:    AZURE_RG, ACR_NAME
  #
  # Until those exist, firing on every push to main just produces a red X
  # that fails at the `az login` step after a few seconds. Keep this on
  # workflow_dispatch only; once Azure is wired, add:
  #   push:
  #     branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Image tag to deploy (defaults to commit SHA)'
        required: false
        type: string

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RG: ${{ vars.AZURE_RG }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_TAG: ${{ inputs.imageTag || github.sha }}

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login -n ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both apps share the same image (single Dockerfile). Tag twice so the
      # Bicep reference to chatbot-api:<tag> and chatbot-ui:<tag> both resolve.
      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/chatbot-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_NAME }}.azurecr.io/chatbot-ui:${{ env.IMAGE_TAG }}
            ${{ env.ACR_NAME }}.azurecr.io/chatbot-api:latest
            ${{ env.ACR_NAME }}.azurecr.io/chatbot-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Bicep
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (dry-run summary)
        run: |
          az deployment group what-if \
            --resource-group "${{ env.AZURE_RG }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
            --parameters imageTag=${{ env.IMAGE_TAG }} \
            --no-pretty-print

      - name: Deploy
        id: deploy
        run: |
          az deployment group create \
            --resource-group "${{ env.AZURE_RG }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
            --parameters imageTag=${{ env.IMAGE_TAG }} \
            --query 'properties.outputs.uiPublicUrl.value' \
            --output tsv

      - name: Smoke-test public UI
        run: |
          URL=$(az deployment group show \
            --resource-group "${{ env.AZURE_RG }}" \
            --name main \
            --query 'properties.outputs.uiPublicUrl.value' \
            --output tsv)
          echo "UI URL: $URL"
          # Streamlit returns 200 on / once the server is up; retry a few times.
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL" > /dev/null; then
              echo "UI reachable."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "UI smoke test failed."
          exit 1
