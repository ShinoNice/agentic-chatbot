services:

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-chatbot-api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount data folder so the vector store persists across container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # httpx is a runtime dep in pyproject.toml, so it's already in the venv.
      # Using it instead of curl avoids shipping curl in the slim runtime image.
      # /readyz only returns 200 once the knowledge base is loaded — that's the
      # right signal for gating the UI's depends_on: service_healthy.
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/api/readyz').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # The Angular UI is not part of compose. Run it for local dev with:
  #   cd frontend && npm start
  # (or `make ui`). It defaults to talking to http://localhost:8001 which
  # this compose's `api` service exposes — no proxy / no nginx needed
  # for dev. Prod uses the standalone frontend/Dockerfile via Terraform.
