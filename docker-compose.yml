services:

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-chatbot-api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount data folder so the vector store persists across container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # httpx is a runtime dep in pyproject.toml, so it's already in the venv.
      # Using it instead of curl avoids shipping curl in the slim runtime image.
      # /readyz only returns 200 once the knowledge base is loaded — that's the
      # right signal for gating the UI's depends_on: service_healthy.
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/api/readyz').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Streamlit UI ───────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-chatbot-ui
    command: streamlit run ui/streamlit_frontend.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Inside the compose network, reach the api container by service name.
      # Overrides the frontend's default of http://localhost:8001.
      - API_BASE_URL=http://api:8001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
