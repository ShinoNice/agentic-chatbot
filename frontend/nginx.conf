server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed/immutable assets emitted by the Angular build.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico|gif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html — it's the entrypoint and references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Reverse-proxy /api/* to the FastAPI container (internal ACA hostname).
    # The API container app's name is `chatbot-api` in the same ACA env, so
    # ACA's built-in DNS resolves it. Same-origin keeps CORS irrelevant in prod.
    location /api/ {
        proxy_pass http://chatbot-api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer the response; keep the connection alive long enough
        # for slow LLM-driven streams (drafter + repair can run > 60s).
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — every unknown path returns index.html so Angular's router
    # can take over. MUST be the last location block.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
