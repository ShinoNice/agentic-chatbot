server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed/immutable assets emitted by the Angular build.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico|gif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html — it's the entrypoint and references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Reverse-proxy /api/* to the FastAPI container app inside the ACA env.
    # `ca-chatbot-api` is the container app's name (with the namePrefix
    # ca- prefix); ACA injects its own DNS into /etc/resolv.conf so this
    # name resolves to the internal-only ingress IP.
    #
    # No `resolver` directive: nginx resolves the hostname at startup using
    # the container's /etc/resolv.conf. ACA deploys the api container
    # before this one (TF depends_on), so resolution succeeds at boot.
    # Tradeoff: nginx caches the resolved IP forever — an api revision
    # change is fine (same internal hostname), but an api recreate would
    # need an nginx reload. Acceptable: api recreate is rare.
    #
    # Local docker run (no ACA DNS) will fail to start with this config;
    # for local testing override with --network or a hosts file mapping.
    location /api/ {
        proxy_pass http://ca-chatbot-api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer the response; keep the connection alive long enough
        # for slow LLM-driven streams (drafter + repair can run > 60s).
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — every unknown path returns index.html so Angular's router
    # can take over. MUST be the last location block.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
