# Resolver enables runtime DNS lookups for upstreams. Without this, nginx
# resolves `proxy_pass` hostnames at startup — fatal if the upstream isn't
# resolvable yet (cold deploy, local testing, etc.).
#   - 168.63.129.16  → Azure's internal DNS (works inside ACA for chatbot-api)
#   - 8.8.8.8        → public fallback for anywhere else
# `valid=30s` re-resolves every 30s so a redeployed upstream gets picked up.
resolver 168.63.129.16 8.8.8.8 valid=30s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed/immutable assets emitted by the Angular build.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico|gif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html — it's the entrypoint and references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Reverse-proxy /api/* to the FastAPI container (internal ACA hostname).
    # The full app name in ACA is `ca-chatbot-api` (the `ca-` prefix comes
    # from the namePrefix variable in TF). Using a `set` variable forces
    # nginx to resolve the upstream lazily via the resolver above, instead
    # of crashing at boot if the upstream is unreachable. ACA-internal DNS
    # resolves it in prod; locally a 502 is the expected outcome (the SPA
    # itself still loads on /).
    location /api/ {
        set $api_upstream "http://ca-chatbot-api";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer the response; keep the connection alive long enough
        # for slow LLM-driven streams (drafter + repair can run > 60s).
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — every unknown path returns index.html so Angular's router
    # can take over. MUST be the last location block.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
