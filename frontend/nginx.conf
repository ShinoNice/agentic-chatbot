server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed/immutable assets emitted by the Angular build.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico|gif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html — it's the entrypoint and references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Reverse-proxy /api/* to the FastAPI container app inside the ACA env.
    # __API_UPSTREAM__ is substituted by entrypoint.sh from the API_UPSTREAM
    # env var (set by Terraform to the full internal FQDN, e.g.
    # ca-chatbot-api.internal.<env-suffix>.northeurope.azurecontainerapps.io).
    # ACA's internal ingress is host-based: it only routes when the Host
    # header matches the full FQDN; short names like `ca-chatbot-api` get
    # 404 from ACA's edge.
    location /api/ {
        # ACA's internal ingress is HTTPS-only — plain HTTP returns a 301
        # to the same path on https://, which nginx forwards to the client
        # (leaking the internal hostname). Talk HTTPS directly.
        proxy_pass https://__API_UPSTREAM__;
        proxy_ssl_server_name on;
        proxy_ssl_name __API_UPSTREAM__;
        proxy_http_version 1.1;
        # Host MUST be the full internal FQDN for ACA's edge to route.
        proxy_set_header Host              __API_UPSTREAM__;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer the response; keep the connection alive long enough
        # for slow LLM-driven streams (drafter + repair can run > 60s).
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — every unknown path returns index.html so Angular's router
    # can take over. MUST be the last location block.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
