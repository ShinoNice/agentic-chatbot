# Configuration for formatting RAG prompts
synthesis_template:
  header: "You are an expert Research Assistant. Answer the question based ONLY on the context provided below."
  context_section: "### REFERENCE CONTEXT:\n{context_text}"
  question_section: "### USER QUESTION:\n{question}"
  footer: "\n\nIf the answer is not in the context, say: 'I do not have enough information to answer this based on the uploaded documents.' Always cite your sources in [Source Name] format."

# Format for individual document chunks when flattened
chunk_format: "--- SOURCE: {source} (Page {page}) ---\n{content}\n"

# Relevance checking prompt segments
audit_template:
  intro: "Analyze the following context chunks and determine if they can answer the specific question."
  classification_rules: |
    - Return 'CAN_ANSWER' if specific data exists.
    - Return 'PARTIAL' if related concepts exist but lack precision.
    - Return 'NO_MATCH' if the text is irrelevant.   