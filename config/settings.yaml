# LLM Model Configuration
model_settings:
  primary_llm: "gpt-4o-mini"
  embedding_model: "text-embedding-3-small"
  temperature: 0.2
  max_tokens: 2000

# RAG & Retrieval Parameters
rag_settings:
  raw_data_dir: "data/raw"
  cache_dir: "data/cache"
  vector_db_path: "data/vector_db"
  pinecone_index_name: "ai-multiagent-index"
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 10
  hybrid_weights: [0.4, 0.6]

# Docling PDF Pipeline Configuration
docling_settings:
  do_ocr: false
  force_full_page_ocr: false
  images_scale: 1.0
  min_chunks_fallback: 5
  # Docling runs in a thread-pool with this hard timeout to guard against hangs
  # on image-heavy pages. Fallback to PyMuPDF kicks in on timeout or failure.
  timeout_seconds: 300
  # PDFs larger than this page count skip Docling and go straight to PyMuPDF.
  max_pages: 80

# Agent prompt-context limits (LLM input bounds)
agent_settings:
  # Hard cap on characters of retrieved context passed into the verifier /
  # relevance-checker prompts. 12k ≈ ~3k tokens — safe under 4o-mini's window.
  max_verifier_context_chars: 12000

# Upload endpoint limits
upload_settings:
  # Hard cap on per-upload PDF size in MiB. 20 is plenty for typical
  # annual reports and technical papers; raising it risks request timeouts.
  max_size_mib: 20

# Application Settings
app:
  debug_mode: true
  max_iterations: 3
  # Lock CORS to known origins. The Azure UI FQDN is the deployed Streamlit
  # frontend; localhost entries are for host dev (Streamlit + Docker Compose).
  cors_origins:
    - "https://ca-chatbot-ui.blacktree-3305419b.northeurope.azurecontainerapps.io"
    - "http://localhost:8501"
    - "http://localhost:8001"
    - "http://localhost:4200"

# Reranker Configuration (cross-encoder, lifts Context Precision)
# Sweep on golden_set_v2 picked candidate_k=30, top_k=10 as the default:
# +24.96pp Context Precision over baseline, no metric regressions.
# See docs/superpowers/specs/2026-04-08-reranker-design.md §13 for the
# full results, including why top_k=5 was rejected (recall regression
# on comparison-style questions).
rerank_settings:
  enabled: true
  model_name: "BAAI/bge-reranker-base" # English-only, ~278 MB
  candidate_k: 30                      # wide retrieve from BM25 + dense
  top_k: 10                            # post-rerank slice into the LLM

# MCP Server Configuration (Guardrails + Audit Trail)
mcp_settings:
  guardrails:
    enabled: true
    redaction_strategy: "mask"           # "mask" | "hash" | "remove"
    scan_input: true                     # scan user queries for PII
    scan_output: true                    # scan draft answers for PII
  audit:
    enabled: true
    db_path: "data/audit/audit.db"
    retention_days: 90                   # 0 = keep forever